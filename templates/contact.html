{% extends "base.html" %} {% block title %}Contact - Your Name{% endblock %} {%
block content %}
<section class="py-5 mt-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-5">
          <h2 class="display-5 fw-bold mb-4 text-center">Get In Touch</h2>
          <p class="text-center mb-5">
            Have a question or want to work together? Drop me a message!
          </p>

          <form method="POST" action="{{ url_for('contact') }}" target="_blank">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  required
                />
              </div>
            </div>
            <div class="mb-4">
              <label for="message" class="form-label">Message</label>
              <textarea
                class="form-control"
                id="message"
                name="message"
                rows="5"
                required
              ></textarea>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-paper-plane me-2"></i>Send Message
              </button>
            </div>
          </form>

          <div class="text-center mt-5">
            <h5 class="mb-3">Connect with me</h5>
            <div class="d-flex gap-3 justify-content-center">
              <a
                href="https://www.linkedin.com/in/shivamchandramola/"
                class="btn btn-outline-danger"
                style="color: #333; background-color: #fff"
                target="blank"
              >
                <i class="fab fa-linkedin"></i> LinkedIn
              </a>
              <a
                href="https://github.com/ShivamRamola"
                class="btn btn-outline-danger"
                style="color: #333; background-color: #fff"
                target="blank"
              >
                <i class="fab fa-github"></i> GitHub
              </a>
              <a
                href="mailto:shivamramola00@gmail.com"
                style="color: #333; background-color: #fff"
                class="btn btn-outline-danger"
                target=" blank"
              >
                <i class="fas fa-envelope"></i> Email
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
